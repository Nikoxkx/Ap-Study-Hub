<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AP Study Hub — deep lessons, active recall, original practice, and unit videos for seven AP courses</title>
  <desc id="desc">A paper-and-ink social card with the AP Study Hub mark, 51 deep lessons, 405 cards, 240 questions, 51 unit videos, and a connected read-recall-respond loop.</desc>
  <defs>
    <pattern id="paper-grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#f6f3ec"/>
      <circle cx="12" cy="18" r="0.8" fill="#1c1b17" opacity="0.045"/>
      <circle cx="74" cy="41" r="0.6" fill="#1c1b17" opacity="0.04"/>
      <circle cx="33" cy="92" r="0.7" fill="#1c1b17" opacity="0.035"/>
      <circle cx="101" cy="78" r="0.5" fill="#1c1b17" opacity="0.04"/>
    </pattern>
    <pattern id="rules" width="8" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 31.5H8" stroke="#ddd6c6" stroke-width="1" opacity="0.42"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#paper-grain)"/>
  <rect width="1200" height="630" fill="url(#rules)" opacity="0.25"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#c3baa5" stroke-width="1"/>
  <rect width="12" height="630" fill="#b0392a"/>

  <!-- Site mark -->
  <g transform="translate(58 46)" fill="none" stroke="#1c1b17" stroke-width="2" stroke-linejoin="miter">
    <path d="M8 36V12l8-6h19v30z" fill="#fffdf7"/>
    <path d="M16 6v6H8z" fill="#ece7db"/>
    <path d="M15 20h13M15 27h13" stroke="#b0392a" stroke-width="1.7"/>
  </g>
  <text x="116" y="81" font-family="DejaVu Serif, Georgia, serif" font-size="34" font-weight="600" fill="#1c1b17">AP Study Hub</text>
  <text x="58" y="132" font-family="DejaVu Sans Mono, monospace" font-size="15" letter-spacing="2.2" fill="#7e786c">2026–27 EDITION  ·  SEVEN AP COURSES</text>

  <text x="58" y="222" font-family="DejaVu Serif, Georgia, serif" font-size="62" font-weight="600" letter-spacing="-2" fill="#1c1b17">Read deeply.</text>
  <text x="58" y="292" font-family="DejaVu Serif, Georgia, serif" font-size="62" font-weight="600" letter-spacing="-2" fill="#1c1b17">Recall actively.</text>
  <text x="58" y="362" font-family="DejaVu Serif, Georgia, serif" font-size="62" font-weight="600" letter-spacing="-2" fill="#1c1b17">Watch by unit.</text>

  <text x="58" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#57534a">Curriculum-linked lessons, visible sources, original practice,</text>
  <text x="58" y="440" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#57534a">and a verified video player inside every unit.</text>

  <path d="M58 480H712" stroke="#1c1b17" stroke-width="2"/>
  <g font-family="DejaVu Serif, Georgia, serif">
    <text x="58" y="527" font-size="38" font-weight="600" fill="#b0392a">51</text>
    <text x="58" y="552" font-size="15" fill="#57534a">deep lessons</text>
    <text x="178" y="527" font-size="38" font-weight="600" fill="#b0392a">405</text>
    <text x="178" y="552" font-size="15" fill="#57534a">cards</text>
    <text x="298" y="527" font-size="38" font-weight="600" fill="#b0392a">240</text>
    <text x="298" y="552" font-size="15" fill="#57534a">questions</text>
    <text x="438" y="527" font-size="38" font-weight="600" fill="#b0392a">66</text>
    <text x="438" y="552" font-size="15" fill="#57534a">unit videos</text>
  </g>
  <text x="58" y="596" font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="1.5" fill="#7e786c">FREE  ·  NO ACCOUNT  ·  NO TRACKING  ·  NO PAYWALL</text>

