<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AP Study Hub — learn seven AP subjects deeply on a quieter kind of study hub</title>
  <desc id="desc">Frosted glass card and realistic loose-leaf notebook paper for seven AP courses with 51 deep lessons, 405 recall cards, 240 original questions, and 66 real unit-video thumbnails.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dde3f2"/>
      <stop offset="100%" stop-color="#ece7df"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#canvas)"/>

  <!-- Left Frosted Glass Showcase Card -->
  <rect x="44" y="48" width="628" height="534" rx="17" fill="#f3f4f7" fill-opacity="0.78" stroke="#ffffff" stroke-width="2"/>

  <!-- Universal 45-degree rotated 7-square logo -->
  <g transform="translate(88 102) scale(0.42) rotate(45)">
    <g transform="translate(-48 -48)" fill="#121212">
      <rect x="2" y="2" width="28" height="28"/>
      <rect x="34" y="2" width="28" height="28"/>
      <rect x="66" y="2" width="28" height="28"/>
      <rect x="66" y="34" width="28" height="28"/>
      <rect x="34" y="34" width="28" height="28"/>
      <rect x="34" y="66" width="28" height="28"/>
      <rect x="2" y="66" width="28" height="28"/>
    </g>
  </g>
  <text x="128" y="113" font-family="DejaVu Serif, Georgia, serif" font-size="34" font-weight="600" fill="#111111">AP Study Hub</text>
  <text x="74" y="164" font-family="DejaVu Sans Mono, monospace" font-size="13.5" letter-spacing="1.6" fill="#4a4a4a">FREE  ·  SEVEN AP COURSES  ·  BUILT BY A STUDENT</text>

  <text x="74" y="246" font-family="DejaVu Serif, Georgia, serif" font-size="54" font-weight="600" letter-spacing="-1.5" fill="#0f0f0f">Learn deeply.</text>
  <text x="74" y="312" font-family="DejaVu Serif, Georgia, serif" font-size="54" font-weight="600" letter-spacing="-1.5" fill="#0f0f0f">Remember longer.</text>
  <text x="74" y="378" font-family="DejaVu Serif, Georgia, serif" font-size="54" font-weight="600" letter-spacing="-1.5" fill="#0f0f0f">Zero noise.</text>

  <text x="74" y="424" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.5" fill="#2e2e2e">Transparent glass study hub with cited lessons, recall cards,</text>
  <text x="74" y="452" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.5" fill="#2e2e2e">original practice, and full-screen unit videos.</text>

  <g font-family="DejaVu Serif, Georgia, serif">
    <text x="74" y="514" font-size="34" font-weight="600" fill="#111111">51</text>
    <text x="74" y="538" font-size="14" fill="#4a4a4a">deep lessons</text>
    <text x="194" y="514" font-size="34" font-weight="600" fill="#111111">405</text>
    <text x="194" y="538" font-size="14" fill="#4a4a4a">cards</text>
    <text x="308" y="514" font-size="34" font-weight="600" fill="#111111">240</text>
    <text x="308" y="538" font-size="14" fill="#4a4a4a">questions</text>
    <text x="440" y="514" font-size="34" font-weight="600" fill="#111111">66</text>
    <text x="440" y="538" font-size="14" fill="#4a4a4a">unit videos</text>
  </g>

  <!-- Right Realistic Loose-Leaf Sheet (exact realistichandwriting.com style) -->
  <g transform="translate(700 48)">
    <rect x="5" y="7" width="456" height="534" rx="3" fill="#000000" fill-opacity="0.13"/>
    <rect width="456" height="534" rx="3" fill="#ffffff" stroke="#b8c2d0" stroke-width="1.2"/>

    <!-- Horizontal light-blue lines inset from outer paper edges -->
    <g stroke="#b8cee5" stroke-width="1">
      <line x1="18" y1="66" x2="438" y2="66"/>
      <line x1="18" y1="96" x2="438" y2="96"/>
      <line x1="18" y1="126" x2="438" y2="126"/>
      <line x1="18" y1="156" x2="438" y2="156"/>
      <line x1="18" y1="186" x2="438" y2="186"/>
      <line x1="18" y1="216" x2="438" y2="216"/>
      <line x1="18" y1="246" x2="438" y2="246"/>
      <line x1="18" y1="276" x2="438" y2="276"/>
      <line x1="18" y1="306" x2="438" y2="306"/>
      <line x1="18" y1="336" x2="438" y2="336"/>
      <line x1="18" y1="366" x2="438" y2="366"/>
      <line x1="18" y1="396" x2="438" y2="396"/>
      <line x1="18" y1="426" x2="438" y2="426"/>
      <line x1="18" y1="456" x2="438" y2="456"/>
      <line x1="18" y1="486" x2="438" y2="486"/>
      <line x1="18" y1="516" x2="438" y2="516"/>
    </g>

    <!-- Full-height red vertical margin rule -->
    <line x1="54" y1="0" x2="54" y2="534" stroke="#de7c7b" stroke-width="1.5"/>

    <!-- Authentic Kalam 300 ballpoint ink resting directly on the blue lines -->
    <g font-family="Kalam, cursive" font-weight="300" font-size="16.5" fill="#30455a">
      <text x="66" y="64">The AP Study Hub Method (2026–27)</text>
      <text x="66" y="94">— Read, Recall, Respond</text>

      <text x="66" y="154">1.</text>
      <text x="66" y="184">Read deeply — A complete lesson (10+ cited</text>
      <text x="66" y="214">paragraphs, sources at section level)</text>

      <text x="66" y="274">2.</text>
      <text x="66" y="304">Recall — Can you produce the idea cold?</text>
      <text x="66" y="334">Term on front, your explanation before flipping.</text>

      <text x="66" y="394">3.</text>
      <text x="66" y="424">Respond — Original practice &amp; exact section links</text>

      <text x="66" y="484">A wrong answer becomes a route back</text>
      <text x="66" y="514">to understanding — not just a score.</text>
    </g>
  </g>
</svg>
