<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AP Study Hub — learn seven AP subjects deeply on a quieter kind of study hub</title>
  <desc id="desc">Frosted glass card and college-ruled notebook paper for seven AP courses with 51 deep lessons, 405 recall cards, 240 original questions, and 66 real unit-video thumbnails.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dde3f2"/>
      <stop offset="100%" stop-color="#ece7df"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#canvas)"/>

  <!-- Left Frosted Glass Showcase Card -->
  <rect x="44" y="48" width="634" height="534" rx="17" fill="#f3f4f7" fill-opacity="0.78" stroke="#ffffff" stroke-width="2"/>

  <!-- Universal 45-degree rotated 7-square logo -->
  <g transform="translate(88 102) scale(0.42) rotate(45)">
    <g transform="translate(-48 -48)" fill="#121212">
      <rect x="2" y="2" width="28" height="28"/>
      <rect x="34" y="2" width="28" height="28"/>
      <rect x="66" y="2" width="28" height="28"/>
      <rect x="66" y="34" width="28" height="28"/>
      <rect x="34" y="34" width="28" height="28"/>
      <rect x="34" y="66" width="28" height="28"/>
      <rect x="2" y="66" width="28" height="28"/>
    </g>
  </g>
  <text x="128" y="113" font-family="DejaVu Serif, Georgia, serif" font-size="34" font-weight="600" fill="#111111">AP Study Hub</text>
  <text x="74" y="164" font-family="DejaVu Sans Mono, monospace" font-size="13.5" letter-spacing="1.6" fill="#4a4a4a">FREE  ·  SEVEN AP COURSES  ·  BUILT BY A STUDENT</text>

  <text x="74" y="246" font-family="DejaVu Serif, Georgia, serif" font-size="54" font-weight="600" letter-spacing="-1.5" fill="#0f0f0f">Learn deeply.</text>
  <text x="74" y="312" font-family="DejaVu Serif, Georgia, serif" font-size="54" font-weight="600" letter-spacing="-1.5" fill="#0f0f0f">Remember longer.</text>
  <text x="74" y="378" font-family="DejaVu Serif, Georgia, serif" font-size="54" font-weight="600" letter-spacing="-1.5" fill="#0f0f0f">Zero noise.</text>

  <text x="74" y="424" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.5" fill="#2e2e2e">Transparent glass study hub with cited lessons, recall cards,</text>
  <text x="74" y="452" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.5" fill="#2e2e2e">original practice, and real YouTube thumbnails per unit.</text>

  <g font-family="DejaVu Serif, Georgia, serif">
    <text x="74" y="514" font-size="34" font-weight="600" fill="#111111">51</text>
    <text x="74" y="538" font-size="14" fill="#4a4a4a">deep lessons</text>
    <text x="194" y="514" font-size="34" font-weight="600" fill="#111111">405</text>
    <text x="194" y="538" font-size="14" fill="#4a4a4a">cards</text>
    <text x="308" y="514" font-size="34" font-weight="600" fill="#111111">240</text>
    <text x="308" y="538" font-size="14" fill="#4a4a4a">questions</text>
    <text x="440" y="514" font-size="34" font-weight="600" fill="#111111">66</text>
    <text x="440" y="538" font-size="14" fill="#4a4a4a">unit videos</text>
  </g>

  <!-- Right Realistic College-Ruled Loose-Leaf Notebook Sheet (zero extra lines or dots) -->
  <g transform="translate(706 58)">
    <rect x="5" y="7" width="450" height="514" rx="4" fill="#000000" fill-opacity="0.14"/>
    <rect width="450" height="514" rx="4" fill="#fbf9f3" stroke="#c8c1b2" stroke-width="1.5"/>

    <!-- Single pink vertical margin rule -->
    <line x1="50" y1="0" x2="50" y2="514" stroke="#e2727c" stroke-opacity="0.58" stroke-width="1.5"/>

    <!-- Horizontal light-blue college-ruled lines every 36px -->
    <g stroke="#7ea8d6" stroke-opacity="0.55" stroke-width="1">
      <line x1="0" y1="62" x2="450" y2="62"/>
      <line x1="0" y1="98" x2="450" y2="98"/>
      <line x1="0" y1="134" x2="450" y2="134"/>
      <line x1="0" y1="170" x2="450" y2="170"/>
      <line x1="0" y1="206" x2="450" y2="206"/>
      <line x1="0" y1="242" x2="450" y2="242"/>
      <line x1="0" y1="278" x2="450" y2="278"/>
      <line x1="0" y1="314" x2="450" y2="314"/>
      <line x1="0" y1="350" x2="450" y2="350"/>
      <line x1="0" y1="386" x2="450" y2="386"/>
      <line x1="0" y1="422" x2="450" y2="422"/>
      <line x1="0" y1="458" x2="450" y2="458"/>
      <line x1="0" y1="494" x2="450" y2="494"/>
    </g>

    <!-- Authentic Caveat handwriting aligned directly on the blue ruled lines -->
    <g font-family="Caveat, cursive" fill="#1d283a">
      <text x="62" y="60" font-size="27" font-weight="700" fill="#141d2b">The AP Study Hub Method (2026–27)</text>

      <text x="22" y="132" font-size="25" font-weight="700" fill="#26354d">1.</text>
      <text x="62" y="132" font-size="25" font-weight="700">Read deeply — A complete lesson</text>
      <text x="62" y="168" font-size="23.5" font-weight="500" fill="#2e3f59">10+ paragraphs, cited at section level</text>

      <text x="22" y="240" font-size="25" font-weight="700" fill="#26354d">2.</text>
      <text x="62" y="240" font-size="25" font-weight="700">Recall — Produce the idea cold</text>
      <text x="62" y="276" font-size="23.5" font-weight="500" fill="#2e3f59">Term on front, your explanation on back</text>

      <text x="22" y="348" font-size="25" font-weight="700" fill="#26354d">3.</text>
      <text x="62" y="348" font-size="25" font-weight="700">Respond — Original practice</text>
      <text x="62" y="384" font-size="23.5" font-weight="500" fill="#2e3f59">Wrong answers route back to the lesson</text>

      <text x="62" y="456" font-size="22" font-weight="700" fill="#182232">Mistakes route straight back to understanding.</text>
    </g>
  </g>
</svg>
