    <text x="38" y="70" font-family="DejaVu Sans Mono, monospace" font-size="12" letter-spacing="1.4" fill="#b0392a">READ  →  RECALL  →  RESPOND</text>
    <text x="38" y="112" font-family="DejaVu Serif, Georgia, serif" font-size="27" fill="#1c1b17">One connected study loop</text>
