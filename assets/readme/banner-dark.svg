  <text x="64" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.8" fill="#837c6f">2026–27 EDITION · SEVEN AP COURSES</text>
  <text x="64" y="202" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', Times, serif" font-size="48" letter-spacing="-1" fill="#ece7dc">Read deeply. Recall actively.</text>
  <text x="64" y="252" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', Times, serif" font-size="48" letter-spacing="-1" fill="#ece7dc">Practise deliberately.</text>
  <path d="M64 277H650" stroke="#ece7dc" stroke-width="2" />
  <text x="64" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e08a78">51 LESSONS · 510 PARAGRAPHS · 405 CARDS · 240 QUESTIONS</text>
  <text x="64" y="357" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.3" fill="#837c6f">FREE · NO ACCOUNT · NO PAYWALL · NO TRACKING</text>
  
